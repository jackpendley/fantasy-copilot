name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The worker queue's tests run against a real Postgres (apps/web/test/db).
    services:
      postgres:
        image: postgres:17
        env:
          # A throwaway database on the runner: no password to keep.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fantasy_copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/fantasy_copilot_test
      - run: pnpm --filter @fantasy-copilot/web build
      # simulate.yml bundles the worker and the task runner from a sparse checkout with no
      # node_modules, so an import of another package fails only there (Nov 19: the task runner
      # broke on lib/nba/context.ts). Bundle both the same way here.
      - name: Worker bundles, as simulate.yml builds them
        run: |
          d=$(mktemp -d)
          rsync -aR --exclude node_modules packages/fantasy-core apps/web/lib apps/web/worker .nvmrc "$d"/
          cd "$d"
          npx --yes esbuild@0.24.0 packages/fantasy-core/worker/worker.ts --bundle --platform=node --format=esm --outfile=worker.mjs
          npx --yes esbuild@0.24.0 apps/web/worker/tasks.ts --bundle --platform=node --format=esm --outfile=tasks.mjs --alias:@fantasy-copilot/fantasy-core=./packages/fantasy-core/src/index.ts
